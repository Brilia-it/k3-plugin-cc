name: CI

# Base CI: build, generated surfaces, types, tests, and distribution drift. Runs on every
# push to main and every PR. NO secrets, NO kimi binary, NO model tokens — the
# real-binary smokes auto-skip without K3_PLUGIN_CC_SMOKE=1. This is the
# per-push safety net the repo previously only had locally via `bun run check`.
#
# BRILIA fork: also runs on `staging/**`. The `main` ruleset requires a green `check`
# on a commit BEFORE main may point at it, so a change is pushed to a `staging/...`
# branch first and main is fast-forwarded only once that run passes, with
# `node scripts/promote-to-main.mjs staging/<name>`. Pull requests produce a `check`
# too, but the rule cannot tell who wrote the workflow that produced it: the script
# accepts only a `check` from a push run of THIS file on a staging branch.
# The fork carries no DeepSeek Harness bundle, so upstream's DSH package steps are gone.

on:
  push:
    branches: [main, "staging/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # The companion supports Node >= 22.5; CI keeps upstream's Node 24.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit

      # Rebuilds and checks root dist/ plus the self-contained Codex package.
      # Generated surface hashes and untracked distribution files are checked too.
      - name: Check (build, surfaces, typecheck, test, drift gate)
        run: bun run check

      - name: Check root npm package installation
        run: bun run check:package

      - name: Audit installed npm consumer dependencies
        run: bun run check:consumer-security

  windows-spawn:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
      - run: bunx tsc -p tsconfig.build.json
      - name: Compiled Windows spawn and large-prompt controls (no model calls)
        run: node --test tests/windows/spawn-preflight.mjs
